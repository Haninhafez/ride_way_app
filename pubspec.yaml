name: ride_way_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  animated_text_kit: ^4.3.0
  bloc: ^9.2.0
  cloud_firestore: ^6.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  dotlottie_flutter: ^0.1.7
  dotted_line: ^3.3.0
  easy_localization: ^3.0.8
  equatable: ^2.0.8
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.4
  get_it: ^9.2.1
  go_router: ^17.5.0
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  internet_connection_checker: ^3.0.1
  loader_overlay: ^5.0.0
  lottie: ^3.5.1
  pretty_dio_logger: ^1.4.0
  provider: ^6.1.5+1
  rename: ^3.1.0
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^3.0.0
  toastification: ^3.2.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
    lottie: true

flutter:
  uses-material-design: true

  # --- تعريف المسارات (Assets) ---
  assets:
    - assets/animations/
    - assets/images/app_images/
    - assets/images/icon_images/
    - assets/fonts/
    - assets/translations/

  # --- تعريف الخطوط المباشرة (Fonts) ---
  fonts:
    # --- Outfit Font ---
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit/static/Outfit-Thin.ttf
          weight: 100
        - asset: assets/fonts/Outfit/static/Outfit-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Outfit/static/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit/static/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit/static/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit/static/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit/static/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit/static/Outfit-ExtraBold.ttf
          weight: 800

    # --- Readex Pro Font ---
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/Readex_Pro/static/ReadexPro-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Readex_Pro/static/ReadexPro-Light.ttf
          weight: 300
        - asset: assets/fonts/Readex_Pro/static/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/Readex_Pro/static/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/Readex_Pro/static/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Readex_Pro/static/ReadexPro-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon_images/icon_app.png"
  adaptive_icon_background: null
